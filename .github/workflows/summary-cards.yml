# Generates profile summary card SVGs into profile-summary-card-output/ on main.
# Replaces the flaky shared github-readme-stats instance with self-hosted SVGs.
# Docs: https://github.com/vn7n24fzkq/github-profile-summary-cards

name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # once a day at 02:00 UTC
    - cron: "0 2 * * *"
  # allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 3
