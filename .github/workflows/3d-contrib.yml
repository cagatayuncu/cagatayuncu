# Generates a 3D contribution calendar and commits it to profile-3d-contrib/.
# Docs: https://github.com/yoshi389111/github-profile-3d-contrib

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # once a day at 03:00 UTC
    - cron: "0 3 * * *"
  # allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3d contribution graph" || echo "no changes to commit"
          git push
