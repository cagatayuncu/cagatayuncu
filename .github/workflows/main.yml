# Generates a contribution graph snake animation and publishes it to the `output` branch.
# Docs: https://github.com/Platane/snk

name: Generate Snake

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  # allows manual runs from the Actions tab
  workflow_dispatch:
  # regenerate whenever the profile repo is updated
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
